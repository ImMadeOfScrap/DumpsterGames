name: Build Dumpster Divers for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Get source code
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install application dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build Windows installer and portable EXE
        working-directory: desktop
        run: npm run dist
      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: Dumpster-Divers-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish EXEs to GitHub Release (when a v* tag is pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          generate_release_notes: true
